<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="عداء المعرفة">
  <meta name="theme-color" content="#101a3a">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>عداء المعرفة</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1230;
      touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
    #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #0b1230; outline: none; }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: radial-gradient(circle at 50% 35%, #233a85 0%, #0b1230 70%); color: #fff;
      font-family: "Segoe UI", Tahoma, "Geeza Pro", "Noto Kufi Arabic", sans-serif; z-index: 5; transition: opacity .5s; }
    #loader img { width: 140px; height: 140px; border-radius: 28px; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
    #loader h1 { margin: 0; font-size: 44px; color: #ffd34d; text-shadow: 0 4px 0 rgba(0,0,0,.35); }
    #bar { width: min(70vw, 520px); height: 18px; border-radius: 10px; background: rgba(255,255,255,.15); overflow: hidden; }
    #fill { width: 0%; height: 100%; background: linear-gradient(90deg, #ffb300, #ffe066); border-radius: 10px; transition: width .2s; }
    #msg { font-size: 20px; opacity: .85; }
    #credit { position: absolute; bottom: 18px; font-size: 16px; opacity: .7; }
    #login { display: flex; flex-direction: column; align-items: center; gap: 14px; min-height: 110px; }
    #login .who { font-size: 22px; display: flex; align-items: center; gap: 12px; }
    #login .who img { width: 46px; height: 46px; border-radius: 50%; box-shadow: none; }
    #login button { font-family: inherit; font-size: 22px; font-weight: 700; border: 0; border-radius: 16px; padding: 14px 34px; cursor: pointer;
      box-shadow: 0 6px 0 rgba(0,0,0,.25); transition: transform .08s; }
    #login button:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
    #btn-google { background: #fff; color: #222; display: flex; align-items: center; gap: 12px; }
    #btn-google svg { width: 26px; height: 26px; }
    #btn-play { background: linear-gradient(#3fd36b, #22a94c); color: #fff; font-size: 28px !important; padding: 16px 60px !important; }
    #btn-switch { background: transparent; color: #cfd8ff; box-shadow: none !important; font-size: 17px !important; padding: 6px 12px !important; text-decoration: underline; }
    #login-note { font-size: 16px; opacity: .8; max-width: 520px; text-align: center; line-height: 1.6; }
    #login-denied { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; max-width: 600px; }
    .denied-title { font-size: 26px; font-weight: 800; color: #ffb4b4; }
    .denied-text { font-size: 18px; line-height: 1.7; opacity: .9; }
    #btn-recheck { background: linear-gradient(#ffd34d, #ffb300); color: #3a2a00; }
    #btn-switch2 { background: transparent; color: #cfd8ff; box-shadow: none !important; font-size: 17px !important; padding: 6px 12px !important; text-decoration: underline; }
    #login-err { font-size: 17px; color: #ff9a9a; max-width: 560px; text-align: center; }
    .hidden { display: none !important; }
    #rotate { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: #0b1230; color: #fff; font-family: inherit; font-size: 26px; z-index: 10; text-align: center; padding: 24px; }
    #rotate .phone { width: 70px; height: 120px; border: 6px solid #ffd34d; border-radius: 14px; animation: turn 1.8s ease-in-out infinite; }
    @keyframes turn { 0%,20% { transform: rotate(0deg); } 60%,100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader">
    <img src="icon.png" alt="">
    <h1>عداء المعرفة</h1>
    <div id="login">
      <div id="login-wait">جارٍ التحقق من الحساب…</div>
      <button id="btn-google" class="hidden"><svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>الدخول بحساب Google</button>
      <div id="login-user" class="hidden">
        <div class="who"><img id="user-photo" alt="" referrerpolicy="no-referrer"><span>أهلاً <b id="user-name"></b></span></div>
        <button id="btn-play">ابدأ اللعب</button>
        <button id="btn-switch">لست أنت؟ الدخول بحساب آخر</button>
      </div>
      <div id="login-denied" class="hidden">
        <div class="denied-title">⛔ حسابك غير مسجّل في قائمة اللاعبين</div>
        <div class="denied-text">الحساب <b id="denied-email" dir="ltr"></b> لم يضفه المعلم بعد.<br>وصل طلبك للمعلم — بعد ما يضيفك اضغط «تحقّق مرة ثانية».</div>
        <button id="btn-recheck">تحقّق مرة ثانية</button>
        <button id="btn-switch2">الدخول بحساب آخر</button>
      </div>
      <div id="login-note">سجّل الدخول بحسابك ليظهر اسمك في لوحة المتصدرين</div>
      <div id="login-err"></div>
    </div>
    <div id="bar" class="hidden"><div id="fill"></div></div>
    <div id="msg" class="hidden">جارٍ تحميل اللعبة…</div>
    <div id="credit">تصميم وفكرة: الأستاذ عبدالرحيم مبارك الرحبي</div>
  </div>
  <div id="rotate"><div class="phone"></div><div>أدِر الجهاز بشكل أفقي للعب</div></div>
  <script>
    var canvas = document.getElementById('unity-canvas');
    var fill = document.getElementById('fill'), msg = document.getElementById('msg'), loader = document.getElementById('loader');
    var dpr = Math.min(window.devicePixelRatio || 1, /iPad|iPhone|Android|Mobile/i.test(navigator.userAgent) || navigator.maxTouchPoints > 1 ? 1.5 : 2);
    var config = {
      arguments: [],
      dataUrl: "Build/EduRunner_Web.data.unityweb",
      frameworkUrl: "Build/EduRunner_Web.framework.js.unityweb",
      codeUrl: "Build/EduRunner_Web.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "عداء المعرفة",
      productVersion: "0.1.0",
      devicePixelRatio: dpr,
      matchWebGLToCanvasSize: true,
      autoSyncPersistentDataPath: true,
      showBanner: function (text, type) { if (type === 'error') { msg.textContent = text; console.error(text); } else console.warn(text); }
    };
    // stop the page itself from scrolling / zooming while the game is touched
    ['touchmove', 'gesturestart', 'dblclick'].forEach(function (e) {
      document.addEventListener(e, function (ev) { ev.preventDefault(); }, { passive: false });
    });
    // tap once to go full screen on tablets (browsers need a tap for that)
    function goFull() {
      var el = document.documentElement;
      var rq = el.requestFullscreen || el.webkitRequestFullscreen;
      if (rq && !document.fullscreenElement && !document.webkitFullscreenElement) { try { rq.call(el); } catch (e) {} }
      try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {}); } catch (e) {}
    }
    if (navigator.maxTouchPoints > 0) document.addEventListener('touchend', goFull, { once: true });

    // the game loads only after the student signs in (see the Firebase module below)
    window.eduStartGame = function () {
    if (window.eduStarted) return; window.eduStarted = true;
    document.getElementById('login').classList.add('hidden');
    document.getElementById('bar').classList.remove('hidden');
    msg.classList.remove('hidden');
    var script = document.createElement('script');
    script.src = "Build/EduRunner_Web.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        fill.style.width = Math.round(p * 100) + '%';
        if (p >= 0.9) msg.textContent = 'لحظات وتبدأ…';
      }).then(function (inst) {
        window.unityInstance = inst;
        loader.style.opacity = '0'; setTimeout(function () { loader.remove(); }, 600);
      }).catch(function (e) { msg.textContent = 'تعذّر تشغيل اللعبة على هذا المتصفح: ' + e; });
    };
    document.body.appendChild(script);
    };
  </script>
  <script type="module" src="edu-account.js"></script>
</body>
</html>
